<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Journal Photo - Multi-Ambiances</title>
    <style>
        /* ==========================================================
           1. STYLES GÉNÉRAUX & CURSEURS SUR-MESURE PAR THÈME
           ========================================================== */
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: background 0.8s ease;
        }

        /* --- AMBIANCE 1 : BLEU NUIT ÉTOILÉ (Curseur Étoile) --- */
        body.theme-bleu {
            background-color: #050714;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' font-size='24'>⭐</svg>"), auto;
        }
        body.theme-bleu::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(138, 180, 248, 0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 120px, rgba(197, 138, 248, 0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 200px 200px, #ffffff, rgba(0,0,0,0));
            background-size: 350px 350px;
            opacity: 0.9;
            animation: scintillementPaillettes 1.5s infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        body.theme-bleu .carousel-item {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 25px rgba(138, 180, 248, 0.4);
        }

        /* --- AMBIANCE 2 : BÉTON BRUT (Curseur Bonhomme) --- */
        body.theme-beton {
            background-color: #55585d;
            background-image: 
                radial-gradient(circle at 30% 20%, #3f4246 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #6e7278 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, #2f3236 0%, transparent 60%),
                linear-gradient(45deg, rgba(0,0,0,0.15) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(255,255,255,0.05) 25%, transparent 25%);
            background-size: 100% 100%, 100% 100%, 100% 100%, 8px 8px, 8px 8px;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' font-size='24'>👤</svg>"), auto;
        }
        body.theme-beton .carousel-item {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* --- AMBIANCE 3 : VERT & ROSE MARBRÉ (Curseur Fée) --- */
        body.theme-feerique {
            background-color: #d1f4e0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(244, 194, 215, 0.8) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(144, 238, 144, 0.7) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.9) 0%, transparent 60%),
                radial-gradient(circle at 90% 10%, rgba(255, 182, 193, 0.8) 0%, transparent 40%);
            background-size: 150% 150%;
            animation: marbrageMouvant 12s ease infinite alternate;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' font-size='24'>🧚‍♀️</svg>"), auto;
        }
        @keyframes marbrageMouvant {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        body.theme-feerique::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(3px 3px at 40px 60px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 180px, #76ff03, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 250px 90px, #ff69b4, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 320px 280px, #ffffff, rgba(0,0,0,0));
            background-size: 250px 250px;
            opacity: 0.95;
            animation: scintillementPaillettes 1s infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        body.theme-feerique .carousel-item {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(118, 255, 3, 0.4);
        }

        /* --- AMBIANCE 4 : CIEL TEXTURÉ NUAGE (Curseur Nuage) --- */
        body.theme-ciel {
            background-color: #6294d1;
            background-image: 
                radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.6) 0%, transparent 45%),
                radial-gradient(circle at 70% 60%, rgba(200, 225, 255, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 10% 80%, rgba(255, 255, 255, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 90% 20%, rgba(255, 255, 255, 0.5) 0%, transparent 40%);
            background-size: 120% 120%;
            cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' font-size='24'>☁️</svg>"), auto;
        }
        body.theme-ciel .carousel-item {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 25px rgba(255, 255, 255, 0.5);
        }

        /* Animation de scintillement façon paillettes intenses */
        @keyframes scintillementPaillettes {
            0% { opacity: 0.3; transform: scale(0.98); filter: brightness(0.8); }
            50% { opacity: 1; transform: scale(1.02); filter: brightness(1.4); }
            100% { opacity: 0.4; transform: scale(1); filter: brightness(0.9); }
        }

        /* ==========================================================
           2. LES FLÈCHES ARRONDIES EN TEXTURE DE CRAIE BLANCHE
           ========================================================== */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: 3px dashed #ffffff;
            border-radius: 50px;
            color: #ffffff;
            font-size: 2.2rem;
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
            opacity: 0.85;
            transition: all 0.3s ease;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            user-select: none;
        }

        .nav-arrow:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
            border-style: solid;
        }

        #prevBtn { left: 40px; }
        #nextBtn { right: 40px; }

        /* ==========================================================
           3. LA SCÈNE 3D ET LA ROUE
           ========================================================== */
        .carousel-stage {
            perspective: 1600px;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .carousel {
            width: 320px;  
            height: 240px; 
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .carousel-item {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 10px;
            overflow: hidden;
            background-color: #1a1a1a;
            backface-visibility: hidden;
            transition: box-shadow 0.5s ease;
        }

        .carousel-item a {
            display: block;
            width: 100%;
            height: 100%;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Positionnement exact pour 5 photos (360° / 5 = 72°) */
        .carousel-item:nth-child(1) { transform: rotateY(0deg) translateZ(420px); }
        .carousel-item:nth-child(2) { transform: rotateY(72deg) translateZ(420px); }
        .carousel-item:nth-child(3) { transform: rotateY(144deg) translateZ(420px); }
        .carousel-item:nth-child(4) { transform: rotateY(216deg) translateZ(420px); }
        .carousel-item:nth-child(5) { transform: rotateY(288deg) translateZ(420px); }
    </style>
</head>
<body class="theme-bleu">

    <!-- Flèches arrondies craie bien orientées -->
    <button class="nav-arrow" id="prevBtn">&larr;</button>
    <button class="nav-arrow" id="nextBtn">&rarr;</button>

    <div class="carousel-stage">
        <div class="carousel" id="carousel">
            <!-- Les 5 photos injectées dynamiquement selon l'ambiance -->
        </div>
    </div>

    <script>
        // ==========================================================
        // 4. DONNÉES : 5 PHOTOS DIFFÉRENTES POUR CHAQUE AMBIANCE
        // ==========================================================
        const themeData = {
            'theme-bleu': [
                { img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&h=450&auto=format&fit=crop", link: "fait.html" },
                { img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-2.html" },
                { img: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-3.html" },
                { img: "https://images.unsplash.com/photo-1426604966848-d7adac902bff?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-4.html" },
                { img: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-5.html" }
            ],
            'theme-beton': [
                { img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-1.html" },
                { img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-2.html" },
                { img: "https://images.unsplash.com/photo-1506157786151-b8491531f063?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-3.html" },
                { img: "https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-4.html" },
                { img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-5.html" }
            ],
            'theme-feerique': [
                { img: "YEOUIDO ECOLOGIC PARK 2.JPG", link: "fee-1.html" },
                { img: "YEOUIDO ECOLOGIC PARK 1.JPG.html" },
                { img: "SAULE PLEUREUR 1.JPG", link: "fee-3.html" },
                { img: "SEOUL FOREST PART 1 . 1.JPG" },
                { img: "SEOUL FOREST PART 2 . 1.JPG", link: "fee-5.html" }
            ],
            'theme-ciel': [
                { img: "https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-1.html" },
                { img: "https://images.unsplash.com/photo-1509803874385-db7c23652552?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-2.html" },
                { img: "https://images.unsplash.com/photo-1517685352821-92cf88aee5a5?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-3.html" },
                { img: "https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-4.html" },
                { img: "https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-5.html" }
            ]
        };

        // ==========================================================
        // 5. MOTEURS : ROTATION 3D & CHANGEMENT D'AMBIANCE DYNAMIQUE
        // ==========================================================
        let currentAngle = 0;
        const carousel = document.getElementById('carousel');

        window.addEventListener('wheel', (event) => {
            currentAngle += event.deltaY * 0.35; 
            carousel.style.transform = `rotateY(${currentAngle}deg)`;
        });

        const themes = ['theme-bleu', 'theme-beton', 'theme-feerique', 'theme-ciel'];
        let currentThemeIndex = 0;
        const body = document.body;

        function updateCarouselPhotos(themeName) {
            carousel.innerHTML = ""; 
            const photos = themeData[themeName];

20            photos.forEach(item => {
                const div = document.createElement('div');
                div.className = 'carousel-item';
                div.innerHTML = `
                    <a href="${item.link}">
                        <img src="${item.img}" alt="Photo de l'ambiance">
                    </a>
                `;
                carousel.appendChild(div);
            });
        }

        function changeTheme(direction) {
            body.classList.remove(themes[currentThemeIndex]);
            currentThemeIndex = (currentThemeIndex + direction + themes.length) % themes.length;
            const newTheme = themes[currentThemeIndex];
            
            body.classList.add(newTheme);
            updateCarouselPhotos(newTheme);
        }

        document.getElementById('nextBtn').addEventListener('click', () => changeTheme(1));
        document.getElementById('prevBtn').addEventListener('click', () => changeTheme(-1));

        // Initialisation
        updateCarouselPhotos(themes[0]);
    </script>
</body>
</html>
