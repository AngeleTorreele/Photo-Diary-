<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Journal Photo - Minimaliste</title>
    <style>
        /* ==========================================================
           1. STYLES GÉNÉRAUX & FOND BLANC
           ========================================================== */
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #ffffff;
            transition: background 0.5s ease;
            cursor: default; /* Curseur classique */
        }

        body.theme-bleu,
        body.theme-beton,
        body.theme-feerique,
        body.theme-ciel {
            background-color: #ffffff;
        }

        /* ==========================================================
           2. LES FLÈCHES DE NAVIGATION POUR LES THÈMES
           ========================================================== */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #222222;
            font-size: 3rem;
            cursor: pointer;
            z-index: 10;
            opacity: 0.4;
            transition: opacity 0.3s, transform 0.3s;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
        }

        .nav-arrow:hover {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }

        #prevBtn { left: 40px; }
        #nextBtn { right: 40px; }

        /* ==========================================================
           3. LE CONTENEUR DU SLIDER LINÉAIRE (Zoom & Superposition)
           ========================================================== */
        .carousel-stage {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .carousel {
            display: flex;
            align-items: center;
            gap: -80px; /* Espace négatif pour forcer la superposition rapprochée */
            position: absolute;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .carousel-item {
            width: 300px;  /* Format légèrement rapetissé */
            height: 210px; 
            flex-shrink: 0;
            border: none;
            border-radius: 6px; /* Tout petit arrondi discret */
            overflow: hidden;
            background-color: #f0f0f0;
            opacity: 0.35; /* Transparence pour les côtés */
            transform: scale(0.75); /* Plus petites sur les côtés pour l'effet de zoom */
            transition: opacity 0.4s ease, transform 0.4s ease, box-shadow 0.4s ease;
            z-index: 1;
        }

        /* La photo centrale (active) : zoomée à 100%, nette, au premier plan */
        .carousel-item.active {
            opacity: 1;
            transform: scale(1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.12);
            z-index: 5; /* Au-dessus des autres pour se superposer proprement */
        }

        .carousel-item a {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Boutons de contrôle pour faire défiler les photos du thème */
        .slider-controls {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .slider-btn {
            background: none;
            border: 1px solid #cccccc;
            color: #333;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .slider-btn:hover {
            border-color: #222;
            background-color: #222;
            color: #fff;
        }
    </style>
</head>
<body class="theme-bleu">

    <!-- Flèches pour changer de THÈME -->
    <button class="nav-arrow" id="prevBtn">&larr;</button>
    <button class="nav-arrow" id="nextBtn">&rarr;</button>

    <div class="carousel-stage">
        <div class="carousel" id="carousel"></div>
    </div>

    <!-- Boutons pour défiler les photos -->
    <div class="slider-controls">
        <button class="slider-btn" id="slidePrev">&larr; Précédent</button>
        <button class="slider-btn" id="slideNext">Suivant &rarr;</button>
    </div>

    <script>
        const themeData = {
            'theme-bleu': [
                { img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&h=450&auto=format&fit=crop", link: "fait.html" },
                { img: "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-2.html" },
                { img: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-3.html" },
                { img: "https://images.unsplash.com/photo-1426604966848-d7adac902bff?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-4.html" },
                { img: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?q=80&w=600&h=450&auto=format&fit=crop", link: "bleu-5.html" }
            ],
            'theme-beton': [
                { img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-1.html" },
                { img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-2.html" },
                { img: "https://images.unsplash.com/photo-1506157786151-b8491531f063?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-3.html" },
                { img: "https://images.unsplash.com/photo-1494526585095-c41746248156?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-4.html" },
                { img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?q=80&w=600&h=450&auto=format&fit=crop", link: "beton-5.html" }
            ],
            'theme-feerique': [
                { img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=600&h=450&auto=format&fit=crop", link: "fee-1.html" },
                { img: "https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=600&h=450&auto=format&fit=crop", link: "fee-2.html" },
                { img: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=600&h=450&auto=format&fit=crop", link: "fee-3.html" },
                { img: "https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=600&h=450&auto=format&fit=crop", link: "fee-4.html" },
                { img: "https://images.unsplash.com/photo-1542224566-6e85f2e6772f?q=80&w=600&h=450&auto=format&fit=crop", link: "fee-5.html" }
            ],
            'theme-ciel': [
                { img: "https://images.unsplash.com/photo-1534088568595-a066f410bcda?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-1.html" },
                { img: "https://images.unsplash.com/photo-1509803874385-db7c23652552?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-2.html" },
                { img: "https://images.unsplash.com/photo-1517685352821-92cf88aee5a5?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-3.html" },
                { img: "https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-4.html" },
                { img: "https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=600&h=450&auto=format&fit=crop", link: "ciel-5.html" }
            ]
        };

        let currentIndex = 0;
        const carousel = document.getElementById('carousel');
        const themes = ['theme-bleu', 'theme-beton', 'theme-feerique', 'theme-ciel'];
        let currentThemeIndex = 0;
        const body = document.body;

        function updateCarouselPhotos(themeName) {
            carousel.innerHTML = ""; 
            const photos = themeData[themeName];
            photos.forEach(item => {
                const div = document.createElement('div');
                div.className = 'carousel-item';
                div.innerHTML = `
                    <a href="${item.link}">
                        <img src="${item.img}" alt="Photo de l'ambiance">
                    </a>
                `;
                carousel.appendChild(div);
            });
            currentIndex = 0;
            updateSliderPosition();
        }

        function updateSliderPosition() {
            const items = carousel.querySelectorAll('.carousel-item');
            if (items.length === 0) return;

            const itemWidth = 300; // Largeur de la photo
            const overlap = 90;    // Espace de chevauchement entre les photos
            const containerWidth = window.innerWidth;
            
            // Centrer l'élément actif
            const offset = (containerWidth / 2) - (itemWidth / 2) - (currentIndex * (itemWidth - overlap));
            carousel.style.transform = `translateX(${offset}px)`;

            items.forEach((item, index) => {
                if (index === currentIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        function slidePhotos(direction) {
            const currentTheme = themes[currentThemeIndex];
            const maxIndex = themeData[currentTheme].length - 1;
            
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex > maxIndex) currentIndex = maxIndex;

            updateSliderPosition();
        }

        document.getElementById('slideNext').addEventListener('click', () => slidePhotos(1));
        document.getElementById('slidePrev').addEventListener('click', () => slidePhotos(-1));

        window.addEventListener('wheel', (event) => {
            if (event.deltaY > 0) {
                slidePhotos(1);
            } else {
                slidePhotos(-1);
            }
        }, { passive: true });

        function changeTheme(direction) {
            body.classList.remove(themes[currentThemeIndex]);
            currentThemeIndex = (currentThemeIndex + direction + themes.length) % themes.length;
            const newTheme = themes[currentThemeIndex];
            
            body.classList.add(newTheme);
            updateCarouselPhotos(newTheme);
        }

        document.getElementById('nextBtn').addEventListener('click', () => changeTheme(1));
        document.getElementById('prevBtn').addEventListener('click', () => changeTheme(-1));

        updateCarouselPhotos(themes[0]);
        window.addEventListener('resize', updateSliderPosition);
    </script>
</body>
</html>
